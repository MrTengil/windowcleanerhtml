<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5A2B"/>
      <stop offset="45%" stop-color="#A9702F"/>
      <stop offset="100%" stop-color="#6E4420"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B6B7C"/>
      <stop offset="100%" stop-color="#3E4A58"/>
    </linearGradient>
  </defs>

  <g stroke="#0A0A0A" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">

    <!-- Handle shaft -->
    <rect x="216" y="248" width="80" height="230" rx="22" fill="url(#handleGrad)"/>
    <!-- Handle highlight -->
    <rect x="232" y="262" width="18" height="196" rx="9" fill="#C98A3E" stroke="none"/>

    <!-- Grip / neck connector (light wedge piece) -->
    <path d="M198 198
             C198 176 214 166 234 168
             C248 169 244 186 256 186
             C268 186 264 169 278 168
             C298 166 314 176 314 198
             L314 250
             C314 262 302 270 290 270
             L222 270
             C210 270 198 262 198 250
             Z"
          fill="#EAF3FA"/>
    <!-- inner shading on grip -->
    <path d="M234 200 C240 214 240 234 232 250" fill="none" stroke="#BBD6E8" stroke-width="10"/>

    <!-- Metal top channel -->
    <rect x="46" y="70" width="420" height="60" rx="14" fill="url(#metalGrad)"/>

    <!-- Rubber blade -->
    <rect x="46" y="128" width="420" height="80" rx="14" fill="#FFE14D"/>
    <!-- Orange bottom trim of blade -->
    <path d="M46 178 h420 v16 a14 14 0 0 1 -14 14 h-392 a14 14 0 0 1 -14 -14 Z" fill="#F5A623"/>

  </g>
</svg>
