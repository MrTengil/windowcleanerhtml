    <ellipse cx="112" cy="128" rx="6" ry="8" transform="rotate(-8 112 128)"/>
    <ellipse cx="145" cy="80" rx="5" ry="7" transform="rotate(25 145 80)"/>
    <ellipse cx="42" cy="70" rx="5" ry="6" transform="rotate(-20 42 70)"/>
