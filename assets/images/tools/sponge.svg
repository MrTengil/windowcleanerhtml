  </defs>

  <path d="M46 40
           Q30 16 58 12
           Q76 -4 96 14
           Q118 2 132 20
           Q158 18 160 44
           Q182 52 172 76
           Q188 92 168 106
           Q176 128 150 132
           Q142 152 116 144
           Q98 162 76 146
           Q52 154 44 130
           Q20 126 24 100
           Q4 88 18 66
           Q14 44 46 40 Z"
