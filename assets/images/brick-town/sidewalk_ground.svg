<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!--
    Ground piece for the base of the brick building (640 wide, matches the
    repeatable floor tile). Flat, straight-on elevation view (no vanishing
    point / road-from-above perspective) to match the building facade:
    large concrete sidewalk flagstones on top, a band of small cobblestone
    setts along the very bottom edge, like a street-level photo looking
    straight at the wall.
  -->
  <defs>
    <linearGradient id="slabGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBCFD2"/>
      <stop offset="100%" stop-color="#B9BDC1"/>
    </linearGradient>
    <linearGradient id="cobbleBand" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CA0A3"/>
      <stop offset="100%" stop-color="#84888B"/>
    </linearGradient>
  </defs>

  <!-- Sidewalk flagstones -->
  <rect x="0" y="0" width="640" height="230" fill="url(#slabGrad)"/>

  <!-- Main straight joint lines (no perspective convergence) -->
  <g stroke="#9BA0A4" stroke-width="3" opacity="0.7">
    <line x1="0" y1="150" x2="640" y2="150"/>
    <line x1="140" y1="0" x2="140" y2="150"/>
    <line x1="300" y1="0" x2="300" y2="230"/>
    <line x1="460" y1="0" x2="460" y2="150"/>
    <line x1="560" y1="150" x2="560" y2="230"/>
    <line x1="80" y1="150" x2="80" y2="230"/>
  </g>

  <!-- Diagonal cut flagstones for a bit of realism, like the reference photo -->
  <g stroke="#9BA0A4" stroke-width="3" fill="none" opacity="0.7">
    <path d="M300 150 L360 200 L300 230"/>
    <path d="M300 150 L240 205"/>
    <path d="M0 60 L60 0"/>
    <path d="M580 60 L640 0"/>
  </g>

  <!-- Subtle slab tone variation -->
  <g opacity="0.12">
    <rect x="140" y="0" width="160" height="150" fill="#FFFFFF"/>
    <rect x="460" y="0" width="100" height="150" fill="#000000"/>
    <rect x="0" y="150" width="80" height="80" fill="#000000"/>
  </g>

  <!-- Faint stains -->
  <ellipse cx="200" cy="190" rx="26" ry="9" fill="#6E7378" opacity="0.22"/>
  <ellipse cx="500" cy="70" rx="22" ry="8" fill="#6E7378" opacity="0.18"/>

  <!-- Hairline crack -->
  <path d="M420 20 L430 45 L418 62" fill="none" stroke="#8B9095" stroke-width="2" opacity="0.6"/>

  <!-- Cobblestone gutter strip along the bottom edge -->
  <rect x="0" y="230" width="640" height="70" fill="url(#cobbleBand)"/>
  <g stroke="#6C7175" stroke-width="2" opacity="0.8">
    <!-- row 1 -->
    <line x1="0" y1="253" x2="640" y2="253"/>
    <!-- row 2 -->
    <line x1="0" y1="276" x2="640" y2="276"/>
  </g>
  <g stroke="#6C7175" stroke-width="2" opacity="0.7">
    <!-- vertical setts, offset like real cobble coursing -->
    <line x1="24" y1="230" x2="24" y2="253"/>
    <line x1="70" y1="230" x2="70" y2="253"/>
    <line x1="116" y1="230" x2="116" y2="253"/>
    <line x1="162" y1="230" x2="162" y2="253"/>
    <line x1="208" y1="230" x2="208" y2="253"/>
    <line x1="254" y1="230" x2="254" y2="253"/>
    <line x1="300" y1="230" x2="300" y2="253"/>
    <line x1="346" y1="230" x2="346" y2="253"/>
    <line x1="392" y1="230" x2="392" y2="253"/>
    <line x1="438" y1="230" x2="438" y2="253"/>
    <line x1="484" y1="230" x2="484" y2="253"/>
    <line x1="530" y1="230" x2="530" y2="253"/>
    <line x1="576" y1="230" x2="576" y2="253"/>
    <line x1="622" y1="230" x2="622" y2="253"/>

    <line x1="47" y1="253" x2="47" y2="276"/>
    <line x1="93" y1="253" x2="93" y2="276"/>
    <line x1="139" y1="253" x2="139" y2="276"/>
    <line x1="185" y1="253" x2="185" y2="276"/>
    <line x1="231" y1="253" x2="231" y2="276"/>
    <line x1="277" y1="253" x2="277" y2="276"/>
    <line x1="323" y1="253" x2="323" y2="276"/>
    <line x1="369" y1="253" x2="369" y2="276"/>
    <line x1="415" y1="253" x2="415" y2="276"/>
    <line x1="461" y1="253" x2="461" y2="276"/>
    <line x1="507" y1="253" x2="507" y2="276"/>
    <line x1="553" y1="253" x2="553" y2="276"/>
    <line x1="599" y1="253" x2="599" y2="276"/>

    <line x1="24" y1="276" x2="24" y2="300"/>
    <line x1="70" y1="276" x2="70" y2="300"/>
    <line x1="116" y1="276" x2="116" y2="300"/>
    <line x1="162" y1="276" x2="162" y2="300"/>
    <line x1="208" y1="276" x2="208" y2="300"/>
    <line x1="254" y1="276" x2="254" y2="300"/>
    <line x1="300" y1="276" x2="300" y2="300"/>
    <line x1="346" y1="276" x2="346" y2="300"/>
    <line x1="392" y1="276" x2="392" y2="300"/>
    <line x1="438" y1="276" x2="438" y2="300"/>
    <line x1="484" y1="276" x2="484" y2="300"/>
    <line x1="530" y1="276" x2="530" y2="300"/>
    <line x1="576" y1="276" x2="576" y2="300"/>
    <line x1="622" y1="276" x2="622" y2="300"/>
  </g>
  <!-- soft highlight on cobbles -->
  <g opacity="0.15" fill="#FFFFFF">
    <rect x="0" y="230" width="640" height="6"/>
  </g>
</svg>
