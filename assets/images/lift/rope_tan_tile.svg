<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 64" width="30" height="64">
  <!--
    Vertically-repeatable rope segment (tan, matches the hanging board's
    rope). Flat top/bottom edges, no end caps, so you can stitch copies
    together end-to-end (y = 0, 64, 128, ...) for a rope of any length.
    The twist texture uses a diagonal-line pattern (period 16px, evenly
    dividing this tile's 64px height) instead of a gradient, so the phase
    lines up perfectly at every seam and it stays visible in every renderer
    (a gradient on a straight vertical shape has a zero-width bounding box
    and gets dropped by strict SVG renderers).
  -->
  <defs>
    <pattern id="ropeTex" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#C7A968"/>
      <path d="M0,16 L16,0 M-4,4 L4,-4 M12,20 L20,12" stroke="#9C7F44" stroke-width="5" stroke-linecap="round"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="30" height="64" fill="url(#ropeTex)"/>
  <!-- simple solid highlight stripe near one edge (solid color, not a gradient); no rx so it stitches without a notch at the seam -->
  <rect x="4" y="0" width="5" height="64" fill="#DFC98F" opacity="0.55"/>
  <!-- solid shadow stripe near the other edge -->
  <rect x="21" y="0" width="5" height="64" fill="#8A6F3C" opacity="0.35"/>
</svg>
