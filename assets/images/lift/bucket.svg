<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="200" height="220">
  <!-- Standalone cleaning bucket: empty (no water), a towel draped over the rim, and a scraper tool sticking out. -->
  <defs>
    <linearGradient id="metalBucket" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DCE1E4"/>
      <stop offset="45%" stop-color="#B9C0C5"/>
      <stop offset="100%" stop-color="#9AA2A8"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8A9297"/>
      <stop offset="100%" stop-color="#6E767B"/>
    </linearGradient>
    <linearGradient id="toolHandle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5B8DEF"/>
      <stop offset="100%" stop-color="#2A55B8"/>
    </linearGradient>
  </defs>

  <!-- Tool (scraper) sticking out of the bucket, behind the rim -->
  <g transform="rotate(-18 130 90)">
    <rect x="126" y="20" width="10" height="80" rx="4" fill="url(#toolHandle)"/>
    <rect x="112" y="8" width="38" height="16" rx="4" fill="#8B94A3"/>
    <rect x="112" y="8" width="38" height="5" rx="2" fill="#E8ECF2" opacity="0.7"/>
  </g>

  <!-- Wire handle -->
  <path d="M50 70 Q100 20 150 70" fill="none" stroke="#5A6166" stroke-width="5"/>
  <circle cx="50" cy="72" r="6" fill="#6E767B"/>
  <circle cx="150" cy="72" r="6" fill="#6E767B"/>

  <!-- Bucket body (tapered, empty inside) -->
  <path d="M42 78 L158 78 L142 190 Q100 200 58 190 Z" fill="url(#metalBucket)" stroke="#7C848A" stroke-width="3"/>
  <!-- inner shadow to read as empty/hollow -->
  <ellipse cx="100" cy="80" rx="55" ry="13" fill="#5C6469"/>
  <ellipse cx="100" cy="83" rx="48" ry="10" fill="#454C50"/>
  <!-- body shading -->
  <path d="M60 90 L66 178" stroke="#FFFFFF" stroke-width="6" opacity="0.35" stroke-linecap="round"/>
  <path d="M134 90 L130 176" stroke="#7C848A" stroke-width="6" opacity="0.3" stroke-linecap="round"/>

  <!-- Rim -->
  <ellipse cx="100" cy="78" rx="58" ry="13" fill="none" stroke="#5A6166" stroke-width="3"/>
  <path d="M42 78 A58 13 0 0 0 158 78" fill="none" stroke="#C9CFD3" stroke-width="4"/>

  <!-- Draped towel hanging out over the rim -->
  <path d="M64 74 Q52 110 64 148 Q78 136 72 106 Q90 128 80 158 Q96 144 88 76"
        fill="#EAF3FA" stroke="#BFD6E3" stroke-width="2"/>
  <path d="M70 90 Q76 110 72 130" fill="none" stroke="#BFD6E3" stroke-width="2" opacity="0.7"/>
</svg>
