<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 170 640 250" width="640" height="250">
  <!--
    Hanging gondola / scaffold platform, inspired by the reference window-
    washer lift. Suspension cables removed — only the pulley wheels remain
    at the top of each post, ready for you to stitch your own rope/cable
    tiles (e.g. rope_cable_tile.svg) up from them to whatever height you
    need. Centered in a 640-wide canvas to match the building tile width.
    (Internal coordinates are unchanged; only the viewBox window was
    cropped, so the pulleys still sit at y=196 in this file's own
    coordinate space.)
  -->
  <defs>
    <linearGradient id="platformGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5B93C"/>
      <stop offset="100%" stop-color="#D89A22"/>
    </linearGradient>
    <linearGradient id="railGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7C355"/>
      <stop offset="100%" stop-color="#E0A62E"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6B7178"/>
      <stop offset="100%" stop-color="#494E54"/>
    </linearGradient>
    <linearGradient id="bucketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D7DBDE"/>
    </linearGradient>
  </defs>

  <!-- Pulley wheels at the top of each post -->
  <g fill="url(#metalGrad)" stroke="#2E3238" stroke-width="2">
    <circle cx="160" cy="196" r="16"/>
    <circle cx="480" cy="196" r="16"/>
  </g>
  <circle cx="160" cy="196" r="6" fill="#2E3238"/>
  <circle cx="480" cy="196" r="6" fill="#2E3238"/>

  <!-- ===== Railing posts ===== -->
  <g fill="url(#railGrad)" stroke="#8A6A1E" stroke-width="2">
    <rect x="128" y="196" width="16" height="120"/>
    <rect x="212" y="196" width="16" height="120"/>
    <rect x="412" y="196" width="16" height="120"/>
    <rect x="496" y="196" width="16" height="120"/>
  </g>

  <!-- Top and mid rail bars -->
  <g fill="url(#railGrad)" stroke="#8A6A1E" stroke-width="2">
    <rect x="120" y="196" width="400" height="14" rx="4"/>
    <rect x="120" y="248" width="400" height="10" rx="3"/>
  </g>

  <!-- Diagonal safety bars at each end -->
  <g stroke="#8A6A1E" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <line x1="128" y1="316" x2="228" y2="210"/>
    <line x1="428" y1="210" x2="512" y2="316"/>
  </g>

  <!-- ===== Platform floor ===== -->
  <rect x="96" y="316" width="448" height="30" rx="4" fill="url(#platformGrad)" stroke="#8A6A1E" stroke-width="2"/>
  <!-- plank lines -->
  <g stroke="#B98620" stroke-width="2" opacity="0.7">
    <line x1="96" y1="331" x2="544" y2="331"/>
  </g>
  <!-- hazard stripe along the front edge -->
  <g>
    <rect x="96" y="346" width="448" height="14" fill="#2E3238"/>
    <g fill="#F5B93C">
      <polygon points="104,346 122,346 108,360 90,360"/>
      <polygon points="140,346 158,346 144,360 126,360"/>
      <polygon points="176,346 194,346 180,360 162,360"/>
      <polygon points="212,346 230,346 216,360 198,360"/>
      <polygon points="248,346 266,346 252,360 234,360"/>
      <polygon points="284,346 302,346 288,360 270,360"/>
      <polygon points="320,346 338,346 324,360 306,360"/>
      <polygon points="356,346 374,346 360,360 342,360"/>
      <polygon points="392,346 410,346 396,360 378,360"/>
      <polygon points="428,346 446,346 432,360 414,360"/>
      <polygon points="464,346 482,346 468,360 450,360"/>
      <polygon points="500,346 518,346 504,360 486,360"/>
      <polygon points="536,346 554,346 540,360 522,360"/>
    </g>
  </g>

  <!-- Support beam under platform -->
  <rect x="110" y="360" width="420" height="12" rx="3" fill="url(#metalGrad)"/>

  <!-- ===== Winch / motor box mounted on the right end ===== -->
  <g>
    <rect x="440" y="208" width="58" height="46" rx="4" fill="url(#metalGrad)" stroke="#2E3238" stroke-width="2"/>
    <circle cx="469" cy="222" r="7" fill="#2E3238"/>
    <rect x="452" y="234" width="34" height="6" rx="2" fill="#2E3238" opacity="0.7"/>
    <!-- warning sign -->
    <g transform="translate(486,196)">
      <polygon points="10,0 20,18 0,18" fill="#F5C518" stroke="#2E3238" stroke-width="1.5"/>
      <text x="10" y="15" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2E3238" text-anchor="middle">!</text>
    </g>
  </g>

  <!-- ===== Bucket hanging on the left rail ===== -->
  <g>
    <path d="M148 258 L172 258 L168 288 L152 288 Z" fill="url(#bucketGrad)" stroke="#9AA0A4" stroke-width="2"/>
    <path d="M148 258 Q160 250 172 258" fill="none" stroke="#9AA0A4" stroke-width="2"/>
    <path d="M152 258 Q160 240 168 258" fill="none" stroke="#B4890F" stroke-width="3"/>
  </g>

  <!-- Coiled hose for detail -->
  <g fill="none" stroke="#E0A62E" stroke-width="4">
    <circle cx="240" cy="272" r="10"/>
    <circle cx="240" cy="272" r="5"/>
  </g>
</svg>
