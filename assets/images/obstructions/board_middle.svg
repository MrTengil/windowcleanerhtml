<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Board MIDDLE piece — tileable horizontally. Only top/bottom edges are
       outlined; left/right sides have no stroke so placing copies side by
       side (x = 0, 100, 200, ...) reads as one continuous plank with no
       seam. Grain is drawn as perfectly horizontal lines (no left-right
       variation), which tile seamlessly at any width. -->
  <defs>
    <linearGradient id="woodGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9C6B3E"/>
      <stop offset="100%" stop-color="#7A5236"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="100" height="92" fill="url(#woodGradMid)"/>
  <!-- top/bottom border only -->
  <rect x="-2" y="4" width="104" height="6" fill="#1A1208"/>
  <rect x="-2" y="90" width="104" height="6" fill="#1A1208"/>
  <!-- horizontal grain lines (perfectly flat, so any tile width is seamless) -->
  <g stroke="#5A3A24" stroke-width="3" opacity="0.6">
    <line x1="0" y1="24" x2="100" y2="24"/>
    <line x1="0" y1="46" x2="100" y2="46"/>
    <line x1="0" y1="68" x2="100" y2="68"/>
  </g>
  <g stroke="#B08252" stroke-width="2" opacity="0.4">
    <line x1="0" y1="14" x2="100" y2="14"/>
    <line x1="0" y1="58" x2="100" y2="58"/>
  </g>
</svg>
