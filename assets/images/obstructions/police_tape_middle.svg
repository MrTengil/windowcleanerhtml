<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 70" width="40" height="70">
  <!-- Tape MIDDLE piece — tileable horizontally. Width (40) exactly matches
       the diagonal stripe pattern's period, so placing copies side by side
       (x = 0, 40, 80, ...) continues the stripes with no seam. Thin edge
       lines (not a solid frame band) plus reduced opacity, so it reads as
       flimsy plastic film instead of a solid board. -->
  <defs>
    <pattern id="tapeStripesMid" width="40" height="70" patternUnits="userSpaceOnUse" patternTransform="skewX(-25)">
      <rect width="20" height="70" fill="#F5C518"/>
      <rect x="20" width="20" height="70" fill="#1E1E1E"/>
    </pattern>
  </defs>
  <g opacity="0.88">
    <rect x="0" y="0" width="40" height="70" fill="url(#tapeStripesMid)"/>
    <rect x="0" y="0" width="40" height="1.5" fill="#1A1208"/>
    <rect x="0" y="68.5" width="40" height="1.5" fill="#1A1208"/>
    <rect x="0" y="5" width="40" height="6" fill="#FFFFFF" opacity="0.15"/>
  </g>
</svg>
