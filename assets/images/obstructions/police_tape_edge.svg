<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 70" width="40" height="70">
  <!-- Tape END CAP — place one at each end of a run of tiled police_tape_middle pieces. Thin outline (matches the middle piece's thin edge lines) plus reduced opacity, so it reads as flimsy plastic film instead of a solid board. -->
  <defs>
    <pattern id="tapeStripesEdge" width="40" height="70" patternUnits="userSpaceOnUse" patternTransform="skewX(-25)">
      <rect width="20" height="70" fill="#F5C518"/>
      <rect x="20" width="20" height="70" fill="#1E1E1E"/>
    </pattern>
  </defs>
  <g opacity="0.88">
    <path d="M40 1.5 L14 1.5 Q1.5 1.5 1.5 14 L1.5 56 Q1.5 68.5 14 68.5 L40 68.5 Z"
          fill="url(#tapeStripesEdge)" stroke="#1A1208" stroke-width="1.5" stroke-linejoin="round"/>
    <rect x="1.5" y="1.5" width="38.5" height="10" fill="#FFFFFF" opacity="0.15"/>
  </g>
</svg>
